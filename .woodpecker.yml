steps:
  - name: lint-and-test
    image: python:3.11-alpine
    commands:
      - apk add --no-cache shellcheck bash
      - shellcheck src/*.sh systemd/*.sh
      - python -m py_compile src/*.py

  - name: docker-build-push
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/scarredninja/homelab-diagnostics
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_pat
    when:
      event:
        - push
      branch:
        - main
